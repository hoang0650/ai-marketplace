<section class="page route-enter">
  <div class="mb-5 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div>
      <h1 class="section-title">Marketplace</h1>
      <p class="mt-1 text-sm text-muted">Browse AI models, agents, and skill packs</p>
    </div>
    <div class="flex w-full max-w-xl flex-col gap-2 sm:flex-row">
      <input
        class="input"
        type="search"
        [(ngModel)]="query"
        (ngModelChange)="onFilter()"
        placeholder="Search products…"
        aria-label="Search products"
      />
      <select
        class="input sm:max-w-[12rem]"
        [(ngModel)]="selectedCategory"
        (ngModelChange)="onFilter()"
        aria-label="Category"
      >
        <option value="">All categories</option>
        @for (c of categories(); track c.id) {
          <option [value]="c.id">{{ c.label }}</option>
        }
      </select>
    </div>
  </div>

  <div class="mb-5 flex flex-wrap gap-2">
    <a routerLink="/marketplace" class="chip" [class.chip--on]="!selectedCategory">All</a>
    @for (c of categories(); track c.id) {
      <a [routerLink]="['/marketplace', c.id]" class="chip" [class.chip--on]="selectedCategory === c.id">{{ c.label }}</a>
    }
  </div>

  <div class="ct-mkt-grid">
    @for (p of products(); track p.id) {
      <app-product-card [product]="p" />
    } @empty {
      <p class="col-span-full py-10 text-center text-muted">No products match your filters.</p>
    }
  </div>
</section>
