<div class="terms-of-service-container">
  <div class="container py-5">
    <div class="row">
      <div class="col-lg-10 mx-auto">
        <div class="contract-paper">
          <h1 class="contract-title mb-4">{{ doc.title }}</h1>
          <p class="contract-subtitle text-muted mb-2" *ngIf="doc.subtitle">{{ doc.subtitle }}</p>
          <p class="text-muted mb-4">{{ doc.lastUpdatedLabel }}: {{ lastUpdated | date:'longDate' }}</p>

          <div class="content-section" *ngFor="let section of doc.sections">
            <h2 class="section-title" *ngIf="section.title">{{ section.title }}</h2>

            <ng-container *ngFor="let b of section.blocks">
              <h3 class="subsection-title" *ngIf="b.h3">{{ b.h3 }}</h3>
              <h4 class="subsubsection-title" *ngIf="b.h4">{{ b.h4 }}</h4>

              <p *ngFor="let para of b.p || []">{{ para }}</p>

              <p *ngIf="b.strongP"><strong>{{ b.strongP }}</strong></p>

              <ul *ngIf="b.ul?.length">
                <li *ngFor="let item of b.ul">{{ item }}</li>
              </ul>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
