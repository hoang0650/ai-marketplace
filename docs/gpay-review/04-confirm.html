<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Markets — đã thanh toán bằng Google Pay</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #f7f5f2; color: #1a1a1a; }
    .phone { width: 390px; min-height: 844px; margin: 0; background: #fff; padding: 18px 16px 28px; }
    .ok { background: #e8f8ef; color: #15803d; border-radius: 12px; padding: 12px; font-weight: 700; }
    h1 { font-size: 22px; }
    .tx { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid #e5e0d8; }
    .amt { color: #3d7a4a; font-weight: 800; white-space: nowrap; }
    .muted { color: #7a756d; font-size: 12px; margin: 4px 0 0; }
    .amt { color: #3d7a4a; font-weight: 800; }
    .mark { margin-top: 16px; }
  </style>
</head>
<body>
  <div class="phone">
    <p class="ok">Đã thanh toán bằng Google Pay</p>
    <h1>Lịch sử ví</h1>
    <div class="tx">
      <div>
        <strong>Google Pay · completed</strong>
        <p class="muted">Visa •••• 4242 with Google Pay</p>
      </div>
      <div class="amt">+$10.00</div>
    </div>
    <div class="mark">
      <img src="acceptance-mark.png" alt="Google Pay" height="36" />
    </div>
  </div>
</body>
</html>
