<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Markets — payment method</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Roboto, Segoe UI, Arial, sans-serif; background: #fff; color: #202124; }
    .phone { width: 390px; min-height: 844px; margin: 0; background: #fff; padding: 24px 20px 32px; }
    .brand { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #c9a961; font-weight: 800; }
    h1 { font-size: 22px; margin: 10px 0 6px; font-weight: 500; }
    .lede { color: #5f6368; font-size: 14px; margin: 0 0 18px; }
    .opt { display: flex; align-items: center; gap: 14px; border: 1px solid #dadce0; border-radius: 12px; padding: 14px; margin: 10px 0; }
    .opt.selected { border: 2px solid #1a73e8; background: #e8f0fe; }
    .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #5f6368; flex-shrink: 0; }
    .opt.selected .radio { border: 6px solid #1a73e8; width: 20px; height: 20px; }
    .card-art { width: 54px; height: 36px; border-radius: 6px; background: linear-gradient(135deg, #1a1f71, #3949ab); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .paypal-art { width: 54px; height: 36px; border-radius: 6px; background: #003087; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .gpay-mark { height: 56px; width: auto; display: block; }
    .opt strong { display: block; font-size: 15px; font-weight: 500; }
    .opt p { margin: 2px 0 0; color: #5f6368; font-size: 13px; }
    .grow { flex: 1; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="brand">AI Markets</div>
    <h1>Payment method</h1>
    <p class="lede">Select Google Pay as your payment method.</p>

    <div class="opt">
      <span class="radio" aria-hidden="true"></span>
      <span class="card-art">VISA</span>
      <div class="grow">
        <strong>Visa</strong>
        <p>•••• 1234</p>
      </div>
    </div>

    <div class="opt selected">
      <span class="radio" aria-hidden="true"></span>
      <img class="gpay-mark" src="acceptance-mark.png" alt="Google Pay" />
      <div class="grow">
        <strong>Google Pay</strong>
        <p>Visa •••• 4242</p>
      </div>
    </div>

    <div class="opt">
      <span class="radio" aria-hidden="true"></span>
      <span class="paypal-art">P</span>
      <div class="grow">
        <strong>PayPal</strong>
        <p>PayPal balance or card</p>
      </div>
    </div>
  </div>
</body>
</html>
