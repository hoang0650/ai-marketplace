<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Markets — Pay with Google Pay</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #f7f5f2; color: #1a1a1a; }
    .phone { width: 390px; min-height: 844px; margin: 0; background: #fff; padding: 18px 16px 28px; }
    .brand { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #c9a961; font-weight: 800; }
    h1 { font-size: 24px; margin: 8px 0 16px; }
    .bal { background: #111; color: #c9a961; border-radius: 16px; padding: 18px; }
    .bal span { color: rgba(245,240,232,.7); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
    .bal strong { display: block; font-size: 30px; margin-top: 6px; }
    .method { border: 1px solid #c9a961; border-radius: 12px; padding: 14px; margin-top: 16px; display: flex; gap: 10px; align-items: center; }
    .method img { height: 22px; }
    .method p { margin: 2px 0 0; color: #7a756d; font-size: 13px; }
    label { display: block; margin: 16px 0 6px; font-size: 12px; font-weight: 700; color: #7a756d; }
    .amt { border: 1px solid #e5e0d8; border-radius: 8px; padding: 14px; font-weight: 800; }
    .gpay-btn { display: block; margin: 8px 0 0; }
    .gpay-btn img { width: 100%; height: 48px; object-fit: contain; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="brand">AI Markets</div>
    <h1>Ví AI Markets</h1>
    <div class="bal">
      <span>Số dư</span>
      <strong>$2.00</strong>
    </div>
    <div class="method">
      <img src="acceptance-mark.svg" alt="Google Pay" height="40" />
      <div>
        <strong>Google Pay</strong>
        <p>Chrome với tài khoản Google</p>
      </div>
    </div>
    <label>Nạp tiền (USD)</label>
    <div class="amt">$10.00</div>
    <a class="gpay-btn" href="03-method.html">
      <img src="../../src/assets/brand/google-pay/pay-dark.png" alt="Pay with G Pay" />
    </a>
  </div>
</body>
</html>
